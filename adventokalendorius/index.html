<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Balto katino žiemos pasaka</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1c3068">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&display=swap">
<link rel="stylesheet" href="styles.css?v=1126c">
</head>
<body>
<div id="ext"><div class="w"></div></div>
<div id="stage">
  <div id="bg"></div>
  <div id="world"></div>
  <canvas id="snow" width="1920" height="1080"></canvas>
  <div id="room" hidden></div>
  <div id="bubble" hidden></div>
  <button id="fs" aria-label="Visas ekranas">⛶</button>
  <div id="testbar" hidden>
    <span>Bandymas: gruodžio</span>
    <button id="tminus">−</button><b id="tday">1</b><button id="tplus">+</button>
    <span>d.</span>
    <button id="treset">Uždaryti visas dureles</button>
  </div>
  <div id="film" hidden>
    <div id="filmbox">
      <video id="filmvideo" controls playsinline></video>
      <p id="filmmsg" hidden>Filmukas dar neįkeltas.</p>
      <button id="filmclose">✕</button>
    </div>
  </div>
</div>
<div id="rotate"><span>📱↻</span>Palieskite ekraną<small>arba pasukite telefoną gulsčiai</small></div>
<script src="content.js?v=1126c"></script>
<script src="app.js?v=1126c"></script>
</body>
</html>
